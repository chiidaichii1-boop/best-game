<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lanternkeep — a twilight garden survival</title>
    <meta
      name="description"
      content="Lanternkeep: a 2D top-down horde survival game. You are the keeper of the last lantern in a twilight garden — banish the shadow wisps, gather embers, and survive until dawn."
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070d;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #status {
        position: absolute;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        color: #8f97b8;
        font: 13px system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="720"></canvas>
    <p id="status" role="status" aria-live="polite">Loading Lanternkeep…</p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
